<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StudyFlow</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>🧭</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="shell">
  <aside id="sidebar">
    <div class="brand"><span class="mark">🧭</span><div><h1>StudyFlow</h1><small>seu mapa pessoal de estudos</small></div></div>
    <nav id="side-nav"></nav>
    <div class="sidebar-foot">
      <div class="streak-pill" id="streak-pill">🔥 0 dias</div>
      <button class="nav-item" onclick="App.actions.toggleTheme()">🌓 <span id="theme-label">Tema automático</span></button>
    </div>
  </aside>
  <main id="main">
    <header id="topbar">
      <div class="row"><span style="font-size:20px">🧭</span><h2 id="topbar-title">Hoje</h2></div>
      <button class="icon-btn" style="font-size:20px" onclick="App.actions.goRoute('config')">⚙️</button>
    </header>
    <div id="app"></div>
  </main>
  <nav id="bottomnav"></nav>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>


<script type="module" src="js/app.js?v=5"></script>
</body>
</html>
