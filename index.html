<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StudyFlow</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0D13">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StudyFlow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="shell">
  <aside id="sidebar">
    <div class="brand"><span class="mark">🦉</span><div><h1>StudyFlow</h1><small>seu mapa pessoal de estudos</small></div></div>
    <nav id="side-nav"></nav>
    <div class="sidebar-foot">
      <div class="streak-pill" id="streak-pill">🔥 0 dias</div>
      <button class="nav-item" onclick="App.actions.toggleTheme()">🌓 <span id="theme-label">Tema automático</span></button>
      <div id="app-version" class="faint" style="font-size:10.5px; text-align:center"></div>
    </div>
  </aside>
  <main id="main">
    <header id="topbar">
      <div class="row"><span style="font-size:20px">🦉</span><h2 id="topbar-title">Home</h2></div>
      <button class="icon-btn" style="font-size:20px" onclick="App.actions.goRoute('config')">⚙️</button>
    </header>
    <div id="app"></div>
  </main>
  <nav id="bottomnav"></nav>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>


<script type="module" src="js/app.js?v=23"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
